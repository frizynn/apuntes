<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspaces</title>
<style>
/*THEME*/
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Anthropic Sans","Styrene B","Söhne",Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
nav.bar{flex:none;height:48px;display:flex;align-items:center;gap:4px;padding:0 10px 0 16px;box-shadow:0 1px 0 var(--line)}
nav.bar .t{flex:1;font-weight:550;font-size:14px}
.b{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;text-decoration:none;transition:background .08s,color .08s}
.b:hover{background:var(--hover);color:var(--fg)}.b svg{width:16px;height:16px}
.wrap{flex:1;min-height:0;display:flex}
aside.ws{width:320px;flex:none;overflow-y:auto;padding:20px 12px 24px;box-shadow:1px 0 0 var(--line)}
.ws .h{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px}
.ws .h span{font-size:13px;color:var(--mute)}
.card{display:block;padding:10px 12px;margin:2px 0;border-radius:10px;color:var(--fg);text-decoration:none;transition:background .08s}
.card:hover{background:var(--hover)}
.card .n{font-weight:550;font-size:14px;line-height:20px}
.card .m{color:var(--mute);font-size:12px;line-height:17px;margin-top:2px}
.card.off{opacity:.65}
.empty{color:var(--mute);font-size:13px;padding:8px 12px}
form.new{display:none;margin:4px 4px 12px;padding:10px;border-radius:12px;background:var(--soft)}
form.new.show{display:block}
form.new input,form.new select{width:100%;height:34px;border:0;border-radius:8px;box-shadow:0 0 0 1px var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:0 10px;margin-bottom:8px;outline:0}
form.new input:focus{box-shadow:0 0 0 1px color-mix(in oklab,var(--fg),transparent 70%)}
form.new .r{display:flex;gap:8px}form.new select{flex:1;margin:0}
form.new button{height:34px;padding:0 14px;border:0;border-radius:17px;background:var(--fg);color:var(--on-fg);font:inherit;font-size:13px;cursor:pointer}
form.new .err{color:var(--bad);font-size:12px;margin-top:6px}
main.home{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.col{width:100%;max-width:720px;flex:1;min-height:0;display:flex;flex-direction:column}
.hello{padding:12vh 4px 0;transition:opacity .16s}
.hello h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.hello p{color:var(--mute);margin:0}
body.talking .hello{display:none}
#home-chat{flex:1;min-height:0}
@media (max-width:760px){.wrap{flex-direction:column}aside.ws{width:auto;max-height:38vh;box-shadow:0 1px 0 var(--line)}.hello{padding-top:24px}}
</style>
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script>/*DATA*/</script>
</head>
<body>
<nav class="bar"><span class="t">Workspaces</span>
<button class="b" id="themebtn" aria-label="Light or dark" title="Light or dark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg></button></nav>
<div class="wrap">
<aside class="ws">
  <div class="h"><span>Your courses</span><button class="b" id="newbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>New</button></div>
  <form class="new" id="newform"><input name="name" placeholder="Course name, e.g. Corporate Finance" autocomplete="off" required>
    <div class="r"><select name="language"><option value="en">Guide in English</option><option value="es">Guía en español</option></select><button>Create</button></div><div class="err"></div></form>
  <div id="list"></div>
</aside>
<main class="home"><div class="col">
  <div class="hello"><h1>What do you want to study?</h1><p>Open a course on the left, or tell me what to build or change.</p></div>
  <div id="home-chat"></div>
</div></main>
</div>
<script>
const E = window.ESTUDIO;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function ago(ms) {
  if (!ms) return '';
  const d = (Date.now() - ms) / 864e5;
  return d < 1 ? 'updated today' : d < 2 ? 'updated yesterday' : `updated ${Math.round(d)} days ago`;
}
function list(ws) {
  const el = document.getElementById('list');
  if (!ws.length) { el.innerHTML = '<div class="empty">No courses yet. Create one, or ask in the chat.</div>'; return; }
  el.innerHTML = ws.map((w) => {
    const meta = [w.lectures ? `${w.lectures} lecture${w.lectures > 1 ? 's' : ''}` : 'no lectures yet', w.questions ? `${w.questions} questions` : '', ago(w.updated)].filter(Boolean).join(' · ');
    return w.guide ? `<a class="card" href="/${encodeURIComponent(w.slug)}/"><div class="n">${esc(w.title)}</div><div class="m">${esc(meta)}</div></a>`
      : `<div class="card off"><div class="n">${esc(w.title)}</div><div class="m">No study guide yet · ${esc(w.folder)}</div></div>`;
  }).join('');
}
list(E.workspaces);
window.estudioRefresh = async () => {
  const r = await fetch('/api/list', { method: 'POST', headers: { 'X-Estudio-Token': E.token }, body: '{}' });
  if (r.ok) { E.workspaces = await r.json(); list(E.workspaces); }
};
const form = document.getElementById('newform');
document.getElementById('newbtn').onclick = () => { form.classList.toggle('show'); if (form.classList.contains('show')) form.name.focus(); };
form.onsubmit = async (e) => {
  e.preventDefault();
  const err = form.querySelector('.err'); err.textContent = '';
  const r = await fetch('/api/workspaces', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Estudio-Token': E.token }, body: JSON.stringify({ name: form.name.value, language: form.language.value }) });
  if (!r.ok) { err.textContent = await r.text(); return; }
  const w = await r.json();
  E.workspaces = [...E.workspaces.filter((x) => x.slug !== w.slug), w]; list(E.workspaces);
  form.reset(); form.classList.remove('show');
  const ta = document.querySelector('#ep form textarea');
  ta.value = `Set up "${w.title}": read the syllabus and the material in its folder, list the lectures in course.json, and tell me what is missing.`;
  ta.dispatchEvent(new Event('input')); ta.focus();
};
document.getElementById('themebtn').onclick = () => {
  const t = getComputedStyle(document.documentElement).colorScheme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (e) {}
};
new MutationObserver(() => document.body.classList.toggle('talking', !!document.querySelector('#ep .msgs .m:not(.e)'))).observe(document.getElementById('home-chat'), { childList: true, subtree: true });
</script>
<script>/*PANEL*/</script>
</body></html>
